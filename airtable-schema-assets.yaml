      Here''s how the formula works:


      If Final is blank, it returns {Datum override}.

      If {Datum override} is blank, it returns Final.


      If both dates have a value, it compares them using IS_BEFORE() to determine
      which date is in the future.


      If neither date is in the future, it checks which date is closer to today and
      returns that date.'
