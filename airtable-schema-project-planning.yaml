    formula: "IF(AND({fldV1POvR5BiufpEd}=BLANK(), {fldLXo2SJjgMSBn4o}=BLANK()),\"\"\
      ,\nSWITCH({fldVOsyRlR76odsA0},\n  \"Done\", \"Completed\",\n  \"In progress\"\
      , \n    IF({fldV1POvR5BiufpEd}<TODAY(), \"Overdue\",\n      IF(DATETIME_DIFF({fldV1POvR5BiufpEd},\
      \ TODAY(), \"days\") < 7 , \"Due soon\", \"On track\")\n    ),\n  \"Todo\",\n\
      \    IF({fldV1POvR5BiufpEd}<TODAY(), \"Overdue\",\n      IF(AND({fldLXo2SJjgMSBn4o},{fldLXo2SJjgMSBn4o}<TODAY()),\
      \ \"Start overdue\",\n        IF(DATETIME_DIFF({fldLXo2SJjgMSBn4o}, TODAY(),\
      \ \"days\") < 7, \"Start soon\",\n          IF(DATETIME_DIFF({fldV1POvR5BiufpEd},\
      \ TODAY(), \"days\") < 14, \"Due soon\",\n           \"Upcoming\"\n        \
      \  )\n        )\n      )\n    )\n))\n   "
